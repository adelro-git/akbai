<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AKBai — Warm Precision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=2">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="frames/ios-frame.jsx"></script>
<script type="text/babel" src="components/kai-placeholder.jsx"></script>
<script type="text/babel" src="components/data.jsx?v=2"></script>
<script type="text/babel" src="components/icons.jsx?v=4"></script>
<script type="text/babel" src="app/ui.jsx?v=3"></script>
<script type="text/babel" src="app/screen-home.jsx?v=3"></script>
<script type="text/babel" src="app/screen-chat.jsx?v=3"></script>
<script type="text/babel" src="app/screen-scan.jsx?v=4"></script>
<script type="text/babel" src="app/screen-expenses.jsx?v=3"></script>
<script type="text/babel" src="app/screen-deadlines.jsx?v=3"></script>

<script type="text/babel">
/* global React, ReactDOM, IOSDevice, Kai, PERSONAS,
   HomeScreen, ChatScreen, ScanScreen, ExpensesScreen, DeadlinesScreen,
   NavIconHome, NavIconChat, NavIconMoney, NavIconMore,
   IconKalendaryo, IconPrecio, IconInvoice, IconDrafts, IconCheckin, IconSundayStory */
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "persona": "andoy",
  "lang": "en",
  "countUp": true,
  "scanFab": true
}/*EDITMODE-END*/;

// ───────── Bottom nav ─────────
function BottomNav({ screen, lang, onNav, onScan, onTools, scanFab }) {
  const left = [
    { id: 'home', Ic: NavIconHome, label: lang === 'fil' ? 'Umaga' : 'Home' },
    { id: 'chat', Ic: NavIconChat, label: 'Kai' },
  ];
  const right = [
    { id: 'expenses', Ic: NavIconMoney, label: lang === 'fil' ? 'Pera' : 'Money' },
    { id: 'tools', Ic: NavIconMore, label: lang === 'fil' ? 'Iba pa' : 'More' },
  ];
  const Btn = (t) => {
    const active = screen === t.id;
    const Ic = t.Ic;
    return (
      <button key={t.id} className={`botnav-btn ${active ? 'is-active' : ''}`}
        onClick={() => t.id === 'tools' ? onTools() : onNav(t.id)}>
        <Ic active={active} />
        <span className="bn-label">{t.label}</span>
      </button>
    );
  };
  return (
    <div className="botnav">
      {left.map(Btn)}
      {scanFab ? <div className="botnav-spacer" /> : null}
      {right.map(Btn)}
      {scanFab && (
        <button className="fab-scan" onClick={onScan} aria-label="Scan resibo">
          <svg width="26" height="26" viewBox="0 0 28 28" fill="none">
            <path d="M8 5 Q8 4 9 4 L19 4 Q20 4 20 5 L20 22 L18.5 21 L17 22 L15.5 21 L14 22 L12.5 21 L11 22 L9.5 21 L8 22 Z" fill="#fff" stroke="#d97706" strokeWidth="1.6" strokeLinejoin="round" />
            <line x1="11" y1="11" x2="17" y2="11" stroke="#d97706" strokeWidth="1.3" strokeLinecap="round" />
            <line x1="11" y1="14" x2="15" y2="14" stroke="#d97706" strokeWidth="1.3" strokeLinecap="round" />
          </svg>
        </button>
      )}
    </div>
  );
}

// ───────── More-tools sheet ─────────
function ToolsSheet({ lang, onClose, onPick }) {
  const tools = [
    { id: 'deadlines', Ic: IconKalendaryo, label: lang === 'fil' ? 'BIR Deadlines' : 'BIR Deadlines', sub: lang === 'fil' ? 'Paalala sa filing' : 'Filing reminders', ready: true },
    { id: 'costing', Ic: IconPrecio, label: lang === 'fil' ? 'Tamang Presyo' : 'Pricing & Costing', sub: lang === 'fil' ? 'Magkano dapat singil' : 'What to charge' },
    { id: 'invoices', Ic: IconInvoice, label: lang === 'fil' ? 'Mga Invoice' : 'Invoices', sub: lang === 'fil' ? 'Sinong may utang' : 'Who owes you' },
    { id: 'drafts', Ic: IconDrafts, label: lang === 'fil' ? 'Reply Drafts' : 'Reply Drafts', sub: lang === 'fil' ? 'Draft sagot sa customer' : 'Draft replies' },
    { id: 'checkin', Ic: IconCheckin, label: lang === 'fil' ? 'Kumusta ka?' : 'Daily Check-In', sub: lang === 'fil' ? 'Maikling check-in ni Kai' : 'Quick check-in' },
    { id: 'sunday', Ic: IconSundayStory, label: lang === 'fil' ? 'Sunday Story' : 'Sunday Story', sub: lang === 'fil' ? 'Linggong pagbabalik-tanaw' : 'Weekly recap' },
  ];
  return (
    <div className="sheet-scrim" onClick={onClose}>
      <div className="sheet" onClick={e => e.stopPropagation()}>
        <div className="sheet-grip" />
        <div className="sheet-title label" style={{ color: 'var(--primary)' }}>{lang === 'fil' ? 'Higit pang tools' : 'More tools'}</div>
        <div className="sheet-list">
          {tools.map(t => (
            <button key={t.id} className="sheet-item" onClick={() => onPick(t)}>
              <span className="si-icon"><t.Ic size={44} /></span>
              <div style={{ flex: 1 }}>
                <div className="si-title">{t.label}</div>
                <div className="si-sub">{t.sub}</div>
              </div>
              <span className="si-arrow">→</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

// ───────── Tweaks panel ─────────
function Tweaks({ active, persona, setPersona, lang, setLang, countUp, setCountUp, scanFab, setScanFab }) {
  if (!active) return null;
  return (
    <div className="pop" style={{ position: 'fixed', right: 18, bottom: 18, zIndex: 300, width: 248, background: 'rgba(28,24,16,0.96)', backdropFilter: 'blur(20px)', color: '#fff', padding: 16, borderRadius: 18, boxShadow: '0 30px 60px rgba(0,0,0,0.4)', fontFamily: "'Plus Jakarta Sans', system-ui" }}>
      <div style={{ fontSize: 10.5, fontWeight: 800, color: 'var(--honey-bright)', letterSpacing: '0.14em', textTransform: 'uppercase', marginBottom: 12 }}>Tweaks</div>
      <TwGroup label="Persona">
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 5 }}>
          {Object.values(PERSONAS).map(p => (
            <TwBtn key={p.id} on={persona === p.id} onClick={() => setPersona(p.id)}>{p.emoji} {p.name.split(' ')[0]}</TwBtn>
          ))}
        </div>
      </TwGroup>
      <TwGroup label="Voice">
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 5 }}>
          {[['fil', 'Filipino'], ['en', 'English']].map(([v, l]) => (
            <TwBtn key={v} on={lang === v} onClick={() => setLang(v)}>{l}</TwBtn>
          ))}
        </div>
      </TwGroup>
      <TwGroup label="KPI count-up">
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 5 }}>
          <TwBtn on={countUp} onClick={() => setCountUp(true)}>On</TwBtn>
          <TwBtn on={!countUp} onClick={() => setCountUp(false)}>Off</TwBtn>
        </div>
      </TwGroup>
      <TwGroup label="Scan placement">
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 5 }}>
          <TwBtn on={scanFab} onClick={() => setScanFab(true)}>Center FAB</TwBtn>
          <TwBtn on={!scanFab} onClick={() => setScanFab(false)}>Hidden</TwBtn>
        </div>
      </TwGroup>
    </div>
  );
}
function TwGroup({ label, children }) {
  return (
    <div style={{ marginBottom: 12 }}>
      <div style={{ fontSize: 10.5, color: 'rgba(255,255,255,0.5)', fontWeight: 700, marginBottom: 6, textTransform: 'uppercase', letterSpacing: '0.06em' }}>{label}</div>
      {children}
    </div>
  );
}
function TwBtn({ on, onClick, children }) {
  return (
    <button onClick={onClick} style={{ padding: '7px 8px', borderRadius: 10, background: on ? 'var(--honey)' : 'rgba(255,255,255,0.08)', color: '#fff', fontSize: 11.5, fontWeight: 700, textAlign: 'center' }}>{children}</button>
  );
}

// ───────── App ─────────
function App() {
  const [persona, setPersona] = useState(TWEAK_DEFAULTS.persona);
  const [lang, setLang] = useState(TWEAK_DEFAULTS.lang);
  const [countUp, setCountUp] = useState(TWEAK_DEFAULTS.countUp);
  const [scanFab, setScanFab] = useState(TWEAK_DEFAULTS.scanFab);
  const [screen, setScreen] = useState('home');
  const [toolsOpen, setToolsOpen] = useState(false);
  const [toast, setToast] = useState(null);
  const [tweaksActive, setTweaksActive] = useState(false);

  useEffect(() => { window.__AKB_NOCOUNT = !countUp; }, [countUp]);

  // fit the fixed 402x874 device into any viewport
  const [scale, setScale] = useState(1);
  useEffect(() => {
    const fit = () => {
      const s = Math.min(1, (window.innerWidth - 32) / 402, (window.innerHeight - 32) / 874);
      setScale(s > 0 ? s : 1);
    };
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);

  // tweaks host protocol
  useEffect(() => {
    function onMsg(e) {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === '__activate_edit_mode') setTweaksActive(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksActive(false);
    }
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  useEffect(() => {
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { persona, lang, countUp, scanFab } }, '*');
  }, [persona, lang, countUp, scanFab]);

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(null), 2600);
  }
  function notReady() {
    showToast(lang === 'fil' ? 'Malapit na \u2019to! \uD83D\uDC9b' : 'Coming soon! \uD83D\uDC9b');
  }
  function open(s) {
    if (['home', 'chat', 'expenses', 'deadlines', 'scan'].includes(s)) setScreen(s);
    else notReady();
  }

  const labels = { home: '01 Home', chat: '02 Chat', scan: '03 Scan', expenses: '04 Expenses', deadlines: '05 Deadlines' };
  const dark = screen === 'scan';
  const skey = `${persona}-${lang}-${countUp}`;

  function renderScreen() {
    if (screen === 'home') return <HomeScreen key={skey} persona={persona} lang={lang} onOpen={open} />;
    if (screen === 'chat') return <ChatScreen key={skey} persona={persona} lang={lang} />;
    if (screen === 'expenses') return <ExpensesScreen key={skey} persona={persona} lang={lang} />;
    if (screen === 'deadlines') return <DeadlinesScreen key={skey} lang={lang} />;
    return <HomeScreen key={skey} persona={persona} lang={lang} onOpen={open} />;
  }

  return (
    <div className="stage">
      <div style={{ transform: `scale(${scale})`, transformOrigin: 'center center' }}>
      <IOSDevice dark={dark}>
        {screen === 'scan' ? (
          <ScanScreen lang={lang} onClose={() => setScreen('home')}
            onSaved={(msg) => { setScreen('home'); showToast(msg); }} />
        ) : (
          <div className="app" data-screen-label={labels[screen]}>
            {screen === 'chat' ? (
              renderScreen()
            ) : (
              <div className="app-scroll">{renderScreen()}</div>
            )}

            <BottomNav screen={screen} lang={lang}
              onNav={open} onScan={() => setScreen('scan')} onTools={() => setToolsOpen(true)} scanFab={scanFab} />

            {toolsOpen && (
              <ToolsSheet lang={lang} onClose={() => setToolsOpen(false)}
                onPick={(t) => { setToolsOpen(false); t.ready ? open(t.id) : notReady(); }} />
            )}

            {toast && (
              <div className="pop" style={{ position: 'absolute', left: 16, right: 16, bottom: 96, zIndex: 90, background: 'var(--c-lowest)', boxShadow: 'var(--el-3)', borderRadius: 16, padding: '13px 16px', display: 'flex', alignItems: 'center', gap: 10 }}>
                <Kai size={28} expression="happy" animated={false} />
                <span className="body-strong">{toast}</span>
              </div>
            )}
          </div>
        )}
      </IOSDevice>
      </div>

      <Tweaks active={tweaksActive}
        persona={persona} setPersona={setPersona}
        lang={lang} setLang={setLang}
        countUp={countUp} setCountUp={setCountUp}
        scanFab={scanFab} setScanFab={setScanFab} />

      {!tweaksActive && (
        <div className="tw-hint">💡 Toggle <b>Tweaks</b> for persona, voice & more</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

  <path d="M38 30 Q24 32 24 46 Q24 58 36 62 Q28 56 28 46 Q30 36 40 34 Z" fill="#f5b347"/>
  <path d="M44 44 Q47 41 50 44" stroke="#6d3a08" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M52 44 Q55 41 58 44" stroke="#6d3a08" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M46 50 Q50 54 54 50" stroke="#b0391a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="50" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#1c1c18">AKB<tspan fill="#855300">ai</tspan></text>
</svg>
</template>
</body>
</html>
